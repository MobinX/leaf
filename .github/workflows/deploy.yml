# Deploys the vinext app + Worker (YjsRoom DO, D1) to Cloudflare on every
# push to main. Also runs pending D1 migrations and health-checks the deploy.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    (same token as local .env)
#   CLOUDFLARE_ACCOUNT_ID   (be6bd7b07cabf3c741b718a7b2a38d1c)
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_S3_ENDPOINT
# The R2 + token values are synced as plaintext worker vars, mirroring .env.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build:vinext

      - run: bunx cf d1 migrations apply d9fad5d9-cc75-428e-8118-9bc6261b889d

      - run: bun run deploy:vinext

      - name: Health check
        run: |
          curl -fsS --max-time 30 https://my-app.mobin-devx.workers.dev/collab/health
          echo "deploy-ok"
